spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
app.jwt.secret=test-secret-key-must-be-at-least-32-chars-long-ok
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000
app.seeder.enabled=true
app.rate-limit.capacity=100000
app.rate-limit.refill-tokens=100000
app.rate-limit.refill-seconds=1
app.scheduler.recurring-cron=0 0 1 1 1 ?
app.scheduler.budget-sweep-cron=0 0 2 1 1 ?
app.budget.warning-threshold=80
app.budget.critical-threshold=100
logging.level.com.finance.dashboard=WARN
logging.level.org.springframework.security=WARN

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false

app.mail.from=${MAIL_FROM:noreply@financepro.app}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
