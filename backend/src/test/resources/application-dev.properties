spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

app.jwt.secret=test-secret-key-must-be-at-least-32-chars-long-ok-yes
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

app.seeder.enabled=true
app.mail.from=noreply@test.com
app.frontend.url=http://localhost:5173

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=
spring.mail.password=
spring.mail.test-connection=false

spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=2

app.rate-limit.capacity=100000
app.rate-limit.refill-tokens=100000
app.rate-limit.refill-seconds=1

app.scheduler.recurring-cron=0 0 1 1 1 ?
app.scheduler.budget-sweep-cron=0 0 2 1 1 ?
app.budget.warning-threshold=80
app.budget.critical-threshold=100

spring.cache.type=none

management.health.redis.enabled=false
management.health.mail.enabled=false
management.endpoint.health.show-details=never

logging.level.com.finance.dashboard=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework=WARN