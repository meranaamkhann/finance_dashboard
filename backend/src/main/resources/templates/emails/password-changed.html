<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Password Changed</title>
  <style>
    body { margin:0; padding:0; background:#f8fafc; font-family:'Segoe UI',Arial,sans-serif; }
    .wrapper { max-width:580px; margin:40px auto; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,.08); }
    .header { background:linear-gradient(135deg,#7c3aed,#6d28d9); padding:40px; text-align:center; }
    .header h1 { margin:0; color:#fff; font-size:24px; font-weight:700; }
    .body { padding:40px; }
    .body p { color:#374151; line-height:1.6; margin:0 0 16px; font-size:15px; }
    .success-box { background:#f5f3ff; border:1px solid #ddd6fe; border-radius:10px; padding:20px; text-align:center; margin:16px 0; }
    .footer { text-align:center; padding:24px; border-top:1px solid #e2e8f0; color:#94a3b8; font-size:12px; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header"><h1>✅ Password Changed</h1></div>
  <div class="body">
    <p>Hi <strong th:text="${username}">User</strong>,</p>
    <div class="success-box">
      <p style="margin:0;font-weight:600;color:#7c3aed;">Your password was successfully changed.</p>
    </div>
    <p>All existing sessions have been logged out for your security. Please log in again with your new password.</p>
    <p>If you did not make this change, contact our support immediately at support@financepro.app</p>
  </div>
  <div class="footer">&copy; 2025 FinancePro</div>
</div>
</body>
</html>
