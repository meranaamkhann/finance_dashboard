<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Payment Successful</title>
  <style>
    body { margin:0; padding:0; background:#f8fafc; font-family:'Segoe UI',Arial,sans-serif; }
    .wrapper { max-width:580px; margin:40px auto; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,.08); }
    .header { background:linear-gradient(135deg,#2563eb,#7c3aed); padding:40px; text-align:center; }
    .header h1 { margin:0; color:#fff; font-size:24px; font-weight:700; }
    .body { padding:40px; }
    .body p { color:#374151; line-height:1.6; margin:0 0 16px; font-size:15px; }
    .invoice { background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:24px; }
    .row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #e2e8f0; font-size:14px; }
    .row:last-child { border-bottom:none; font-weight:700; font-size:16px; }
    .label { color:#6b7280; }
    .value { color:#111827; font-weight:600; }
    .badge { display:inline-block; background:#dcfce7; color:#166534; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; }
    .footer { text-align:center; padding:24px; border-top:1px solid #e2e8f0; color:#94a3b8; font-size:12px; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header"><h1>🎉 Payment Successful!</h1></div>
  <div class="body">
    <p>Hi <strong th:text="${username}">User</strong>,</p>
    <p>Thank you for subscribing to FinancePro! Your payment was successful and your plan is now active.</p>
    <div class="invoice">
      <div class="row"><span class="label">Invoice No.</span><span class="value" th:text="${invoiceNumber}">INV-001</span></div>
      <div class="row"><span class="label">Plan</span><span class="value" th:text="${planName}">Pro</span></div>
      <div class="row"><span class="label">Billing</span><span class="value" th:text="${billingCycle}">Monthly</span></div>
      <div class="row"><span class="label">Valid Until</span><span class="value" th:text="${validUntil}">Next month</span></div>
      <div class="row"><span class="label">Status</span><span class="badge">PAID</span></div>
      <div class="row"><span class="label">Amount</span><span class="value" th:text="${amount}">₹299</span></div>
    </div>
  </div>
  <div class="footer">&copy; 2025 FinancePro · Keep this email as your receipt</div>
</div>
</body>
</html>
