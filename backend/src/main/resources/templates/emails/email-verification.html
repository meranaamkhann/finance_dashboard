<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8"/>
<title>Verify Your Email</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f1f5f9;font-family:'Segoe UI',Arial,sans-serif;padding:32px 16px}
.wrap{max-width:560px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.top{background:linear-gradient(135deg,#2563eb,#1d4ed8);padding:36px 40px;text-align:center}
.top h1{color:#fff;font-size:22px;font-weight:700}
.body{padding:36px 40px}
.body p{color:#374151;line-height:1.65;margin-bottom:14px;font-size:15px}
.btn{display:block;width:fit-content;margin:20px auto;background:#2563eb;color:#fff;text-decoration:none;padding:14px 36px;border-radius:10px;font-weight:600;font-size:15px}
.note{background:#f8fafc;border-left:4px solid #2563eb;border-radius:6px;padding:14px 18px;font-size:13px;color:#6b7280;margin-top:16px}
.foot{text-align:center;padding:20px 40px;border-top:1px solid #e5e7eb;font-size:12px;color:#9ca3af}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>✉️ Verify Your Email</h1></div>
  <div class="body">
    <p>Hi <strong th:text="${username}">User</strong>,</p>
    <p>Thanks for signing up for FinancePro! Please verify your email address to activate your account.</p>
    <a th:href="${verifyLink}" class="btn">Verify Email Address</a>
    <div class="note">⏱ This link expires in <strong>24 hours</strong>.<br/>If you didn't create an account, ignore this email.</div>
  </div>
  <div class="foot">&copy; 2026 FinancePro</div>
</div>
</body>
</html>
