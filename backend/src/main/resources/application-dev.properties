spring.datasource.url=jdbc:h2:mem:financedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.rate-limit.capacity=200
app.rate-limit.refill-tokens=200
app.rate-limit.refill-seconds=60
app.scheduler.recurring-cron=0 0 1 * * *
app.scheduler.budget-sweep-cron=0 0 2 * * *
app.budget.warning-threshold=80
app.budget.critical-threshold=100
app.seeder.enabled=true
logging.level.com.finance.dashboard=DEBUG
logging.level.org.springframework.security=WARN

# Mail (dev — prints to log, no real sending unless configured)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false

# App URLs
app.mail.from=${MAIL_FROM:noreply@financepro.app}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Async
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8

razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
# spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
# spring.security.oauth2.client.registration.github.scope=read:user,user:email
# spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8080/login/oauth2/code/github

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
# spring.cache.type=none
spring.cache.redis.time-to-live=300000

app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-size-mb=5
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
