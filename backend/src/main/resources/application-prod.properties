# ==========================================
# DATABASE - PostgreSQL
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=false


# ==========================================
# JWT
# ==========================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}


# ==========================================
# REDIS
# ==========================================

# spring.data.redis.host=${REDIS_HOST:redis}
# spring.data.redis.port=${REDIS_PORT:6379}
# spring.data.redis.password=${REDIS_PASSWORD:}
# spring.data.redis.timeout=2000ms

spring.cache.type=none
# spring.cache.redis.time-to-live=300000


# ==========================================
# RATE LIMITING
# ==========================================

app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:200}
app.rate-limit.refill-tokens=${RATE_LIMIT_REFILL:200}
app.rate-limit.refill-seconds=${RATE_LIMIT_SECONDS:60}


# ==========================================
# SCHEDULERS
# ==========================================

app.scheduler.recurring-cron=0 0 1 * * *
app.scheduler.budget-sweep-cron=0 0 2 * * *


# ==========================================
# BUDGET THRESHOLDS
# ==========================================

app.budget.warning-threshold=80
app.budget.critical-threshold=100


# ==========================================
# SEEDER
# ==========================================

app.seeder.enabled=false


# ==========================================
# MAIL - Gmail SMTP
# ==========================================

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false

app.mail.from=${MAIL_FROM:noreply@financepro.app}
app.frontend.url=${FRONTEND_URL:http://localhost}


# ==========================================
# GOOGLE OAUTH2
# ==========================================

app.oauth2.enabled=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}


# ==========================================
# RAZORPAY
# ==========================================

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}


# ==========================================
# FILE STORAGE
# ==========================================

app.upload.dir=${UPLOAD_DIR:/app/uploads}
app.upload.max-size-mb=5

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB


# ==========================================
# ASYNC
# ==========================================

spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4


# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=false
management.health.mail.enabled=false


# ==========================================
# PROXY / NGINX
# ==========================================

server.forward-headers-strategy=framework


# ==========================================
# LOGGING
# ==========================================

logging.level.com.finance.dashboard=INFO
logging.level.root=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# ==========================================
# SECURITY
# ==========================================

server.error.include-message=never
server.error.include-stacktrace=never